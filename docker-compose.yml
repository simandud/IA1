version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: workforce-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: workforce-social-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - workforce-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: workforce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - workforce-network

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: workforce-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/workforce-social-network?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    networks:
      - workforce-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: workforce-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - workforce-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

networks:
  workforce-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
